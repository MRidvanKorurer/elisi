name: Keep API awake

# Render ücretsiz planı 15 dakika istek gelmezse uyur; ilk istek 30-50 sn sürer.
# GitHub zamanlanmış işleri birkaç dakika gecikebilir, bu yüzden 10 dakikada bir çalışır.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://elisi-fxey.onrender.com/api/health || true)
            echo "API health: $code"
            [ "$code" = "200" ] && break
            sleep 15
          done
      - name: Warm sitemap
        run: curl -s -o /dev/null -w "sitemap: %{http_code}\n" --max-time 30 https://nikbagstore.com/sitemap.xml || true
